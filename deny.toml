# Dependency policy checked by cargo-deny in continuous integration.
# License policy: docs/DEPENDENCIES.md.

[graph]
# Platforms for which release binaries are built.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
# Permissive licenses only. Copyleft licenses (GPL, LGPL, AGPL, SSPL and
# similar) are not listed and are therefore rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# The workspace crates are not published (publish = false) and carry the
# Q-MAWS license file; they are not checked against the list above.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the unpublished workspace crates are not
# wildcards in practice; version wildcards on registry crates stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
