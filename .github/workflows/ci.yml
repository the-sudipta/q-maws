name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --release

      - name: Test the pre-commit guard
        shell: bash
        run: sh scripts/test-guard.sh

      - name: Check folder READMEs
        shell: bash
        run: sh scripts/check-readmes.sh

  determinism:
    name: Cross-platform determinism (G12, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked -p qmaws-cli

      - name: Download Fish mtDNA (MD5 checked)
        shell: bash
        run: ./target/release/qmaws download --dataset fish_mito

      - name: Run Fish mtDNA with the default settings
        shell: bash
        run: ./target/release/qmaws --quiet run --dataset fish_mito --output g12_fish

      - name: Compare the root fingerprint with the golden value
        shell: bash
        run: |
          got=$(tr -d '\r\n' < g12_fish/audit/root.txt)
          want=$(tr -d '\r\n' < tests/golden/fish_mito_root.txt)
          echo "root: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::G12: the Fish mtDNA root on ${{ matrix.os }} is $got, the golden value is $want"
            exit 1
          fi

  dependencies:
    name: Dependency licenses and sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.98.1"
          command: check
          command-arguments: "licenses bans sources"
