name: Website

# Builds and publishes the project website (site/) on GitHub Pages. The page
# reads every number from site/data/site.json, which scripts/site_data.py
# writes from the committed results; so a push that changes the results,
# figures, documentation or the page itself updates the website on its own.

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "figures/**"
      - "docs/**"
      - "site/**"
      - "scripts/site_data.py"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website from the results
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Write the page data and copy the figures
        run: python3 scripts/site_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
