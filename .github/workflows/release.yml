name: Release

# Pushing a tag v<version> (with <version> the workspace version in
# Cargo.toml) creates the GitHub release with its notes from CHANGELOG.md,
# attaches ready-to-run bundles for Windows, macOS and Linux with their
# SHA-256 sums. The bundles are only on the release page (the repository
# holds the source). Can also be started by hand for an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Create the GitHub release with the notes of this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # The CHANGELOG section of this version, up to the next section.
          awk -v v="$version" '
            /^## \[/ { inside = index($0, "[" v "]") > 0 || index($0, "[v" v "]") > 0; next }
            inside { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Q-MAWS $version" --notes-file notes.md --verify-tag
          fi

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches the workspace version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match the workspace version $version in Cargo.toml"
            exit 1
          fi

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p qmaws-cli

      - name: Assemble the bundle
        shell: bash
        run: |
          out="Q-MAWS-$VERSION-${{ matrix.name }}"
          mkdir -p "$out"
          bin="target/${{ matrix.target }}/release/qmaws"
          case "${{ matrix.name }}" in
            windows-*)
              cp "$bin.exe" "$out/Q-MAWS.exe"
              cp run.bat "$out/"
              ;;
            macos-*)
              app="$out/Q-MAWS.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp "$bin" "$app/MacOS/Q-MAWS"
              cp assets/icon/q-maws.icns "$app/Resources/"
              sed "s/VERSION/$VERSION/g" assets/release/Info.plist > "$app/Info.plist"
              cp run.sh "$out/"
              chmod +x "$app/MacOS/Q-MAWS" "$out/run.sh"
              ;;
            linux-*)
              cp "$bin" "$out/Q-MAWS"
              cp run.sh assets/release/q-maws.desktop "$out/"
              cp assets/icon/q-maws-256.png "$out/q-maws.png"
              chmod +x "$out/Q-MAWS" "$out/run.sh"
              ;;
          esac
          cp assets/release/BUNDLE_README.md "$out/README.md"
          cp LICENSE THIRD_PARTY_NOTICES CITATION.cff "$out/"
          echo "BUNDLE=$out" >> "$GITHUB_ENV"

      - name: Check that the program starts
        if: matrix.name != 'macos-x64'
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            windows-*) "$BUNDLE/Q-MAWS.exe" --version ;;
            macos-*) "$BUNDLE/Q-MAWS.app/Contents/MacOS/Q-MAWS" --version ;;
            *) "$BUNDLE/Q-MAWS" --version ;;
          esac

      - name: Pack the bundle
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            windows-*) 7z a -tzip "$BUNDLE.zip" "$BUNDLE" > /dev/null; echo "PACKED=$BUNDLE.zip" >> "$GITHUB_ENV" ;;
            macos-*) ditto -c -k --keepParent "$BUNDLE" "$BUNDLE.zip"; echo "PACKED=$BUNDLE.zip" >> "$GITHUB_ENV" ;;
            *) tar czf "$BUNDLE.tar.gz" "$BUNDLE"; echo "PACKED=$BUNDLE.tar.gz" >> "$GITHUB_ENV" ;;
          esac

      - name: Attach the bundle to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$PACKED" --clobber

      - name: Keep the bundle for the checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.PACKED }}

  checksums:
    name: Checksums
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Attach SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bundles
          sha256sum Q-MAWS-* > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
