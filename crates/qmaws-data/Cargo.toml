[package]
name = "qmaws-data"
description = "Benchmark registry, downloads, manifests, reference trees and the Open Tree of Life client."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1"
md-5 = "0.11"
qmaws-core = { path = "../qmaws-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
