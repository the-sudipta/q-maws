[package]
name = "qmaws-gui"
description = "Desktop GUI application."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Built-in fonts are turned off (no default features): the GUI loads a font
# installed on the computer, so no font files ship with Q-MAWS.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
qmaws-core = { path = "../qmaws-core" }
qmaws-data = { path = "../qmaws-data" }
qmaws-engine = { path = "../qmaws-engine" }
qmaws-viz = { path = "../qmaws-viz" }
serde_json = "1"
