[package]
name = "qmaws-cli"
description = "The qmaws binary: argument parsing and dispatch to terminal or GUI mode."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "qmaws"
path = "src/main.rs"

[dependencies]
qmaws-core = { path = "../qmaws-core" }
qmaws-engine = { path = "../qmaws-engine" }
qmaws-data = { path = "../qmaws-data" }
qmaws-viz = { path = "../qmaws-viz" }
qmaws-tui = { path = "../qmaws-tui" }
qmaws-gui = { path = "../qmaws-gui" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[dev-dependencies]
serde_json = "1"
