[package]
name = "qmaws-engine"
description = "Run orchestration: stages, checkpoints, chunks, progress events and the audit log."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
qmaws-core = { path = "../qmaws-core" }
qmaws-data = { path = "../qmaws-data" }
qmaws-viz = { path = "../qmaws-viz" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
zstd = "0.14"
